packages:
  - "packages/*"
overrides:
  picomatch: "4.0.4"
  rollup: "4.59.0"
  semver: "7.7.4"
  semver@6.3.1: "7.7.4"
  vite: "8.0.11"
  vitefu: "1.1.3"
  yaml: "2.8.3"
cleanupUnusedCatalogs: true
