packages:
  - "packages/*"
overrides:
  # Flue and the app must share one provider contract and model catalog.
  "@earendil-works/pi-ai": "1.0.3"
  # agents uses Babel 7 core; its decorators range also admits Babel 8.
  "agents@0.20.1>@babel/plugin-proposal-decorators": "7.29.7"
  picomatch: "4.0.4"
  rollup: "4.59.0"
  semver: "7.7.4"
  semver@6.3.1: "7.7.4"
  vite: "8.3.1"
  vitefu: "1.1.3"
  yaml: "2.8.3"
cleanupUnusedCatalogs: true
strictDepBuilds: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@anthropic-ai/sdk@0.129.0"
  - "@earendil-works/pi-agent-core"
  - "@earendil-works/pi-ai"
  - "@earendil-works/pi-telemetry@1.0.3"
  - "@flue/cli@2.0.3"
  - "@flue/runtime@2.0.3"
  - "@flue/sdk@2.0.3"
  - "@flue/vite@2.0.3"
trustPolicy: no-downgrade
blockExoticSubdeps: true
allowBuilds:
  "@google/genai": true
  "@mongodb-js/zstd": true
  core-js-pure: true
  esbuild: true
  lefthook: true
  node-liblzma: true
  protobufjs: true
  sharp: true
  workerd: true
