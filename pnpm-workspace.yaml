packages:
  - "packages/*"
overrides:
  # The durable review runtime and app share one provider contract and model catalog.
  "@earendil-works/pi-ai": "1.2.0"
  picomatch: "4.0.4"
  rollup: "4.59.0"
  semver: "7.7.4"
  semver@6.3.1: "7.7.4"
  vite: "8.3.3"
  vitefu: "1.1.3"
  yaml: "2.8.3"
cleanupUnusedCatalogs: true
strictDepBuilds: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@anthropic-ai/sdk@0.129.0"
  - "@earendil-works/pi-agent-core"
  - "@earendil-works/pi-ai"
  - "@earendil-works/pi-telemetry@1.2.0"
trustPolicy: no-downgrade
blockExoticSubdeps: true
allowBuilds:
  "@google/genai": true
  "@mongodb-js/zstd": true
  core-js-pure: true
  esbuild: true
  lefthook: true
  node-liblzma: true
  protobufjs: true
  sharp: true
  workerd: true
